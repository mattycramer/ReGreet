---
workflow:
  rules:
    - if: >-
        $CI_COMMIT_REF_PROTECTED == "true" &&
        $CI_COMMIT_TAG =~ /(^[0-9]$|^[0-9A-Za-z][0-9A-Za-z._-]{0,33}[0-9]$)/
    - if: >-
        $CI_COMMIT_REF_PROTECTED == "true" &&
        $CI_COMMIT_BRANCH == "mcr/release" &&
        $GH_RELEASE_PUSH == "true"
    - when: never

stages:
  - gitlab-release
  - github-sync
  - gitlab-cleanup

include:
  - project: '${GL_CICD_SHARED_PROJ}'
    ref: main
    file: '/release/common.yml'
  - project: '${GL_CICD_SHARED_PROJ}'
    ref: main
    file: '/gitlab/common.yml'
  - project: '${GL_CICD_SHARED_PROJ}'
    ref: main
    file: '/gitlab/validate.yml'
  - project: '${GL_CICD_SHARED_PROJ}'
    ref: main
    file: '/gitlab/release.yml'
  - project: '${GL_CICD_SHARED_PROJ}'
    ref: main
    file: '/rustc/release-build.yml'
  - project: '${GL_CICD_SHARED_PROJ}'
    ref: main
    file: '/github/common.yml'
  - project: '${GL_CICD_SHARED_PROJ}'
    ref: main
    file: '/github/validate.yml'
  - project: '${GL_CICD_SHARED_PROJ}'
    ref: main
    file: '/github/push.yml'
  - project: '${GL_CICD_SHARED_PROJ}'
    ref: main
    file: '/gitlab/cleanup.yml'

variables:
  GH_RELEASE_PUSH: "true"
  GH_FORCE_PUSH: "true"
  GL_RELEASE_ASSET: "true"
  GL_CLEAR_GLAB: "false"
  APPEND_VERSION: "false"
  APPLY_PATCHES: "true"
  APPLY_PATCHES_EXCLUDE: ""
  PATCH_RELEASE_DIR: "patches/release"
  PATCH_SERIES_FILE: "patches/release/series"
  GIT_BRANCH_PREFIX: "mcr"
  GIT_BRANCH_RELEASE: "release"
  RUST_TOOLCHAIN: "nightly"
  RUSTUP_TOOLCHAIN: '${RUST_TOOLCHAIN}'
  RUST_TARGET: "x86_64-unknown-linux-gnu"
  GL_CICD_RUNNER_BUILD: '${GL_CICD_RUNNER_RUST}'
  GL_CICD_RUNNER_RELEASE: '${GL_CICD_RUNNER_UBUNTU}'
  GL_RELEASE_TARGET: '${RUST_TARGET}'
  GL_RELEASE_CARGO_MANIFEST: "Cargo.toml"
  GL_RELEASE_ARTIFACT_PREFIX: "regreet"
  GL_RELEASE_PACKAGE_NAME: "regreet"
  GTK_SYSROOT_APT_PACKAGES: |
    libglib2.0-dev
    libgtk-4-dev
  RELEASE_BINS: |
    regreet

.bws_setup:
  before_script:
    - set -eu
    - export PATH="/usr/local/bin:${PATH}"
    - |
      disable_apt_post_invoke_hooks() {
        hook_dir="/etc/apt/apt.conf.d"
        disabled_dir="/tmp/apt-hooks-disabled"
        if [ ! -d "${hook_dir}" ]; then
          return 0
        fi
        mkdir -p "${disabled_dir}"
        for conf_file in "${hook_dir}"/*; do
          [ -f "${conf_file}" ] || continue
          post_invoke_regex='APT::Update::Post-Invoke|APT::Update::Post-Invoke-Success'
          post_invoke_regex="${post_invoke_regex}|DPkg::Post-Invoke|DPkg::Pre-Invoke"
          if grep -Eq \
            "${post_invoke_regex}" \
            "${conf_file}"
          then
            mv "${conf_file}" "${disabled_dir}/$(basename "${conf_file}")"
          fi
        done
      }

      apt_update_with_retry() {
        local attempt=1
        local max_attempts=3
        while :; do
          if apt-get \
            -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update -y
          then
            return 0
          fi
          if [ "${attempt}" -ge "${max_attempts}" ]; then
            echo "apt-get update failed after ${attempt} attempts." >&2
            return 1
          fi
          sleep $((attempt * 2))
          attempt=$((attempt + 1))
        done
      }

      required_commands="
      awk
      bash
      curl
      git
      openssl
      python3
      sha256sum
      tar
      "
      missing=""
      while IFS= read -r command_name || [ -n "${command_name}" ]; do
        command_name="$(printf '%s' "${command_name}" | xargs)"
        [ -z "${command_name}" ] && continue
        if ! command -v "${command_name}" >/dev/null 2>&1; then
          missing="${missing} ${command_name}"
        fi
      done < <(printf '%s\n' "${required_commands}")
      if [ -n "${missing}" ]; then
        echo "Installing missing bootstrap commands:${missing}" >&2
        disable_apt_post_invoke_hooks
        export DEBIAN_FRONTEND=noninteractive
        apt_update_with_retry
        apt-get \
          -o Acquire::Retries=5 \
          -o Dpkg::Use-Pty=0 \
          install -y --no-install-recommends \
          ca-certificates \
          curl \
          openssl \
          python3 \
          tar \
          coreutils \
          git \
          bash
        rm -rf /var/lib/apt/lists/*
      fi

      missing=""
      while IFS= read -r command_name || [ -n "${command_name}" ]; do
        command_name="$(printf '%s' "${command_name}" | xargs)"
        [ -z "${command_name}" ] && continue
        if ! command -v "${command_name}" >/dev/null 2>&1; then
          missing="${missing} ${command_name}"
        fi
      done < <(printf '%s\n' "${required_commands}")
      if [ -n "${missing}" ]; then
        echo "Missing required bootstrap commands after install:${missing}" >&2
        exit 1
      fi
    - |
      for candidate in \
        /usr/local/bin/bws \
        /usr/bin/bws \
        /bin/bws \
        /opt/bws \
        /opt/bws/bin/bws
      do
        if [ -x "${candidate}" ]; then
          ln -sf "${candidate}" /usr/local/bin/bws
          break
        fi
      done
    - |
      if command -v bws >/dev/null 2>&1; then
        installed_version="$(bws --version 2>/dev/null | awk '{print $NF}')"
        if [ "${installed_version}" = "${BWS_VERSION}" ]; then
          echo "bws ${BWS_VERSION} already installed"
          bws_path="$(command -v bws)"
          [ -n "${bws_path}" ] && ln -sf "${bws_path}" /usr/local/bin/bws
          exit 0
        fi
      fi

      download_with_retry() {
        local url="$1"
        local destination="$2"
        local attempt=1
        local max_attempts=6
        local delay=2
        local status=0

        while :; do
          if curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --connect-timeout 30 \
            --max-time 180 \
            -o "${destination}" \
            "${url}"
          then
            return 0
          fi
          status=$?
          rm -f "${destination}"
          if [ "${attempt}" -ge "${max_attempts}" ]; then
            echo "Failed to download ${url} after ${attempt} attempts." >&2
            return "${status}"
          fi
          echo "Download failed for ${url}" >&2
          echo "Attempt ${attempt}/${max_attempts}" >&2
          echo "Retrying in ${delay}s..." >&2
          sleep "${delay}"
          attempt=$((attempt + 1))
          delay=$((delay * 2))
        done
      }

      base_url="https://github.com/mattycramer/sdk-sm/releases/download/gl-bws-cli-v${BWS_VERSION}"
      archive_name="bws-x86_64-unknown-linux-gnu-${BWS_VERSION}.tar.gz"
      checksum_name="bws-sha256-checksums-${BWS_VERSION}.txt"
      tmp_dir="$(mktemp -d)"
      trap 'rm -rf "${tmp_dir}"' EXIT

      download_with_retry \
        "${base_url}/${archive_name}" \
        "${tmp_dir}/${archive_name}"
      download_with_retry \
        "${base_url}/${checksum_name}" \
        "${tmp_dir}/${checksum_name}"

      expected_hash="$(awk -v f="${archive_name}" '{
        name=$2
        if (name ~ /^\*/) { name=substr(name, 2) }
        if (substr(name, 1, 2) == "./") { name=substr(name, 3) }
        sub(/\r$/, "", name)
        if (name == f) { print $1; exit }
      }' "${tmp_dir}/${checksum_name}")"
      if [ -z "${expected_hash:-}" ]; then
        echo "Checksum for ${archive_name} not found in ${checksum_name}." >&2
        exit 1
      fi
      if [ -n "${BWS_SHA256:-}" ] \
        && [ "${expected_hash}" != "${BWS_SHA256}" ]
      then
        echo "Checksum mismatch for ${archive_name}" >&2
        echo "Expected ${BWS_SHA256}, got ${expected_hash}." >&2
        exit 1
      fi

      printf '%s  %s\n' "${expected_hash}" "${archive_name}" \
        > "${tmp_dir}/bws.sha256"
      (cd "${tmp_dir}" && sha256sum -c "bws.sha256")
      tar -xzf "${tmp_dir}/${archive_name}" -C "${tmp_dir}"
      install -m 0755 "${tmp_dir}/bws" /usr/local/bin/bws
    - |
      if [ ! -x /usr/local/bin/bws ]; then
        echo "bws not found at /usr/local/bin/bws" >&2
        ls -la /usr/local/bin || true
        exit 1
      fi
    - /usr/local/bin/bws --version
    - |
      bws_run_with_retry() {
        local attempt=1
        local max="${BWS_RETRY_MAX:-3}"
        local delay="${BWS_RETRY_DELAY:-2}"
        while :; do
          /usr/local/bin/bws "$@" && return 0
          local status=$?
          if [ "${attempt}" -ge "${max}" ]; then
            echo "BWS run failed after ${attempt} attempts." >&2
            return "${status}"
          fi
          echo "BWS run failed (attempt ${attempt}/${max})." >&2
          echo "Retrying in ${delay}s..." >&2
          sleep "${delay}"
          attempt=$((attempt + 1))
          delay=$((delay * 2))
        done
      }

gl_release_build_asset:
  extends: .gl_release_build_asset_job
  script:
    - !reference [.release_version_prepare, script]
    - !reference [.release_patch_helpers, script]
    - !reference [.gitlab_release_prepare, script]
    - !reference [.rustc_release_asset_build, script]
    - |
      set -euo pipefail

      export DEBIAN_FRONTEND=noninteractive
      sysroot="${CI_PROJECT_DIR}/.ci-gtk-sysroot"
      archives="${CI_PROJECT_DIR}/.ci-gtk-apt-archives"
      arch_triplet="x86_64-linux-gnu"

      rm -rf "${sysroot}" "${archives}"
      mkdir -p "${sysroot}" "${archives}/partial"

      apt-get update -y
      while IFS= read -r package_name || [ -n "${package_name}" ]; do
        package_name="$(printf '%s' "${package_name}" | xargs)"
        [ -z "${package_name}" ] && continue
        apt-get install --download-only -y --no-install-recommends \
          -o Dir::Cache::archives="${archives}" \
          "${package_name}"
      done < <(printf '%s\n' "${GTK_SYSROOT_APT_PACKAGES:-}")

      while IFS= read -r -d '' deb_path; do
        package_file="$(basename "${deb_path}")"
        case "${package_file}" in
          systemd_*|systemd-sysv_*|systemd-timesyncd_*|\
          libpam-systemd_*|dbus-user-session_*)
            echo "Skipping extracted runtime package ${package_file}"
            continue
            ;;
        esac
        dpkg-deb -x "${deb_path}" "${sysroot}"
      done < <(
        find "${archives}" -maxdepth 1 -type f -name '*.deb' -print0 \
          | LC_ALL=C sort -z
      )

      export PKG_CONFIG_SYSROOT_DIR="${sysroot}"
      pkgconfig_dirs="${sysroot}/usr/lib/${arch_triplet}/pkgconfig"
      pkgconfig_dirs="${pkgconfig_dirs}:${sysroot}/usr/lib/pkgconfig"
      pkgconfig_dirs="${pkgconfig_dirs}:${sysroot}/usr/share/pkgconfig"
      library_dirs="${sysroot}/usr/lib/${arch_triplet}:${sysroot}/lib/${arch_triplet}"
      library_dirs="${library_dirs}:${sysroot}/usr/lib:${sysroot}/lib"
      include_dirs="${sysroot}/usr/include:${sysroot}/usr/include/${arch_triplet}"

      export PKG_CONFIG_PATH="${pkgconfig_dirs}"
      export PKG_CONFIG_LIBDIR="${pkgconfig_dirs}"
      export CPATH="${include_dirs}${CPATH:+:${CPATH}}"
      export LIBRARY_PATH="${library_dirs}${LIBRARY_PATH:+:${LIBRARY_PATH}}"
      ld_library_path_extra="${LD_LIBRARY_PATH:-}"
      export LD_LIBRARY_PATH="${library_dirs}"
      if [ -n "${ld_library_path_extra}" ]; then
        export LD_LIBRARY_PATH="${LD_LIBRARY_PATH}:${ld_library_path_extra}"
      fi

      echo "Prepared GTK sysroot at ${sysroot}"
    - /bin/bash /tmp/rustc_release_build.sh
